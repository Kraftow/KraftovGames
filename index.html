<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Рулетка</title>
<style>
  :root { --bg:#0b0b1e; --cyan:#19d3c5; --pink:#ff2fa0; --text:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%, #26146b, var(--bg) 60%);
         color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:24px 16px; }
  h1 { font-size:22px; text-align:center; margin:8px 0 20px; font-weight:600; }
  .wrap { position:relative; width:min(86vw,360px); aspect-ratio:1; }
  .pointer { position:absolute; top:-10px; left:50%; transform:translateX(-50%); z-index:2;
             width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent;
             border-top:28px solid var(--cyan); filter:drop-shadow(0 0 8px var(--cyan)); }
  canvas { width:100%; height:100%; border-radius:50%; box-shadow:0 0 30px #7a3cff88, 0 0 0 4px #ffffff22;
           transition:transform 5s cubic-bezier(.12,.7,.1,1); }
  button { margin-top:28px; width:100%; max-width:360px; padding:16px; font-size:18px; font-weight:700;
           color:#fff; border:2px solid var(--cyan); border-radius:14px;
           background:linear-gradient(90deg,#2b6b62,#111); }
  button:disabled { opacity:.55; }
  #timer { margin-top:14px; font-variant-numeric:tabular-nums; opacity:.85; min-height:22px; }
  #result { margin-top:10px; font-size:20px; font-weight:700; text-align:center; min-height:56px; }
  .tabs { display:flex; width:100%; max-width:360px; margin-top:26px; background:#ffffff0d; border-radius:12px; padding:4px; }
  .tabs div { flex:1; text-align:center; padding:10px 4px; border-radius:9px; font-size:15px; opacity:.7; }
  .tabs div.on { background:#1a1d2e; opacity:1; border-bottom:2px solid var(--cyan); }
  #history { width:100%; max-width:360px; margin-top:14px; display:none; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 12px; margin-bottom:8px; background:#ffffff0d; border-radius:12px; }
  .row img { width:40px; height:40px; }
  .row small { display:block; opacity:.6; margin-top:2px; }
  #resimg { width:96px; height:96px; display:none; margin:6px auto 0; }

  .nav { display:flex; width:100%; max-width:360px; gap:6px; background:#ffffff0d; border-radius:14px; padding:4px; margin-bottom:6px; }
  .nav div { flex:1; text-align:center; padding:10px 4px; border-radius:10px; font-size:15px; opacity:.7; cursor:pointer; }
  .nav div.on { background:#1a1d2e; opacity:1; border-bottom:2px solid var(--pink); }
  .page { width:100%; display:none; flex-direction:column; align-items:center; }
  .page.on { display:flex; }
  .bal { align-self:flex-end; margin:6px 0 0; padding:6px 12px; border-radius:20px; background:#ffffff14; font-weight:700; }
  .card { width:100%; max-width:360px; background:#ffffff0d; border-radius:16px; padding:16px; margin-top:14px; }
  .card h2 { margin:0 0 10px; font-size:17px; }
  .coinwrap { perspective:700px; width:140px; height:140px; margin:10px auto 6px; }
  .coin { width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform 2.4s cubic-bezier(.2,.7,.2,1); }
  .face { position:absolute; inset:0; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:64px;
          backface-visibility:hidden; border:4px solid #ffd76a; box-shadow:0 0 24px #ffd76a66; }
  .face.f { background:radial-gradient(circle,#ffe9a8,#c9962a); }
  .face.b { background:radial-gradient(circle,#d9c6ff,#6a46c9); transform:rotateY(180deg); }
  .sides { display:flex; gap:10px; margin-top:10px; }
  .sides div { flex:1; text-align:center; padding:12px 4px; border:2px solid #ffffff33; border-radius:12px; font-size:15px; }
  .sides div.on { border-color:var(--cyan); background:#19d3c522; }
  .sides div span { display:block; font-size:30px; }
  input, textarea { width:100%; padding:12px; margin-top:8px; border-radius:10px; border:1px solid #ffffff33; background:#00000055; color:#fff; font-size:16px; font-family:inherit; }
  textarea { min-height:100px; resize:vertical; }
  .quick { display:flex; gap:6px; margin-top:8px; }
  .quick span { flex:1; text-align:center; padding:8px 0; border-radius:8px; background:#ffffff14; font-size:14px; }
  .msg { margin-top:10px; text-align:center; font-weight:700; min-height:24px; }
  .top div { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #ffffff14; font-size:14px; }
  .pink { border-color:var(--pink); background:linear-gradient(90deg,#6b2b55,#111); }
</style>
</head>
<body>
<div class="nav"><div id="n1" class="on">🎰 Рулетка</div><div id="n2">🎮 Игры</div><div id="n3" style="display:none">🛠 Админ</div></div>
<div id="balbox" class="bal">🪙 <span id="bal">0</span></div>

<div id="p1" class="page on">
<h1>Воу! Рулетка для своїх готова!</h1>
<div class="wrap"><div class="pointer"></div><canvas id="wheel" width="720" height="720"></canvas></div>
<button id="btn" disabled>Крутить</button>
<div id="timer"></div>
<img id="resimg" alt="">
<div id="result"></div>
<div class="tabs"><div id="t1" class="on">Призи</div><div id="t2">Історія бонусів</div></div>
<div id="history"></div>
</div>

<div id="p2" class="page">
  <div class="card">
    <h2>🥟 Пельмень или 🩴 Тапок</h2>
    <div class="coinwrap"><div class="coin" id="coin"><div class="face f">🥟</div><div class="face b">🩴</div></div></div>
    <div class="sides"><div id="s_pelmen" class="on"><span>🥟</span>Пельмень</div><div id="s_tapok"><span>🩴</span>Тапок</div></div>
    <input id="bet" type="number" inputmode="numeric" min="1" placeholder="Ставка" value="10">
    <div class="quick"><span data-q="10">10</span><span data-q="100">100</span><span data-q="half">½</span><span data-q="all">Все</span></div>
    <button id="flip" class="" style="margin-top:14px">Подбросить</button>
    <div class="msg" id="coinmsg"></div>
    <div style="opacity:.6;font-size:13px;text-align:center">Угадал — ставка x2, не угадал — прощай, монетки.<br>Монеты выдаёт администратор.</div>
  </div>
</div>

<div id="p3" class="page">
  <div class="card"><h2>📊 Статистика</h2><div id="stats">…</div><div class="top" id="top"></div></div>
  <div class="card">
    <h2>💰 Выдать монеты</h2>
    <input id="g_target" placeholder="ID или @username">
    <input id="g_amount" type="number" inputmode="numeric" placeholder="Сумма (отрицательная — списать)">
    <button id="g_btn" style="margin-top:12px">Выдать</button>
    <div class="msg" id="g_msg"></div>
  </div>
  <div class="card">
    <h2>📣 Рассылка</h2>
    <textarea id="b_text" maxlength="4000" placeholder="Текст сообщения для всех пользователей бота"></textarea>
    <button id="b_btn" class="pink" style="margin-top:12px">Отправить всем</button>
    <div class="msg" id="b_msg"></div>
  </div>
</div>

<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
const COLORS = ["#1f8a5b", "#8a1f4f", "#c9a21a", "#3b3b6b"];
const btn = document.getElementById("btn"), timerEl = document.getElementById("timer"),
      resEl = document.getElementById("result"), canvas = document.getElementById("wheel");
let prizes = [], rotation = 0, left = 0, tick = null;

async function api(path) {
  const r = await fetch(path, { method:"POST", headers:{"Content-Type":"application/json"},
                                body: JSON.stringify({ initData: tg.initData }) });
  return { status:r.status, data: await r.json() };
}

function draw() {
  const ctx = canvas.getContext("2d"), c = canvas.width/2, n = prizes.length, a = 2*Math.PI/n;
  prizes.forEach((p,i) => {
    const s = -Math.PI/2 + i*a;                 // сегмент 0 начинается сверху по часовой
    ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,c-4,s,s+a); ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length]; ctx.fill();
    ctx.strokeStyle = "#ffffff55"; ctx.lineWidth = 3; ctx.stroke();
    ctx.save(); ctx.translate(c,c); ctx.rotate(s + a/2);
    ctx.textAlign = "right"; ctx.fillStyle = "#fff";
    if (p.im && p.im.complete) ctx.drawImage(p.im, c-30-110, -75, 110, 110);
    ctx.font = "bold 24px sans-serif"; ctx.fillText(p.name.length>16 ? p.name.slice(0,15)+"…" : p.name, c-30, 62);
    ctx.restore();
  });
}

function startTimer() {
  clearInterval(tick);
  const render = () => {
    if (left <= 0) { btn.disabled = false; timerEl.textContent = ""; clearInterval(tick); return; }
    btn.disabled = true;
    const h = String(Math.floor(left/3600)).padStart(2,"0"), m = String(Math.floor(left%3600/60)).padStart(2,"0"),
          s = String(left%60).padStart(2,"0");
    timerEl.textContent = `Следующая попытка через ${h}:${m}:${s}`; left--;
  };
  render(); tick = setInterval(render, 1000);
}

async function init() {
  const { data } = await api("/api/status");
  prizes = data.prizes; left = data.left; setBal(data.balance || 0);
  if (data.is_admin) { isAdmin = true; $("n3").style.display = "block"; }
  await Promise.all(prizes.map(p => new Promise(r => { p.im = new Image(); p.im.onload = p.im.onerror = r; p.im.src = p.img; })));
  draw();
  left > 0 ? startTimer() : (btn.disabled = false);
}

btn.onclick = async () => {
  btn.disabled = true; resEl.textContent = ""; document.getElementById("resimg").style.display = "none";
  const { status, data } = await api("/api/spin");
  if (status === 429) { left = data.left; startTimer(); return; }
  if (status !== 200) { resEl.textContent = "Ошибка, попробуйте позже"; btn.disabled = false; return; }
  const seg = 360/prizes.length, jitter = (Math.random()-.5)*seg*.7;
  rotation += 360*6 + (360 - (rotation % 360)) - (data.index*seg + seg/2) + jitter;
  canvas.style.transform = `rotate(${rotation}deg)`;
  setTimeout(() => {
    resEl.textContent = `🎉 Вы выиграли: ${data.name}`;
    const ri = document.getElementById("resimg"); ri.src = prizes[data.index].img; ri.style.display = "block";
    if (!document.getElementById("history").style.display.includes("none")) loadHistory();
    tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
    left = data.left; left > 0 ? startTimer() : (btn.disabled = false);
  }, 5200);
};

const hist = document.getElementById("history"), t1 = document.getElementById("t1"), t2 = document.getElementById("t2");
async function loadHistory() {
  const { data } = await api("/api/history");
  hist.innerHTML = data.items.length ? "" : "<div style='text-align:center;opacity:.6'>Поки що порожньо</div>";
  data.items.forEach(it => {
    const p = prizes.find(x => x.name === it.prize) || {};
    const d = new Date(it.ts*1000).toLocaleString("uk-UA", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
    const row = document.createElement("div"); row.className = "row";
    const img = document.createElement("img"); img.src = p.img || "";
    const txt = document.createElement("div"); txt.textContent = it.prize;
    const sm = document.createElement("small"); sm.textContent = d; txt.appendChild(sm);
    row.append(img, txt); hist.appendChild(row);
  });
}
t1.onclick = () => { t1.className = "on"; t2.className = ""; hist.style.display = "none"; };
t2.onclick = () => { t2.className = "on"; t1.className = ""; hist.style.display = "block"; loadHistory(); };
hist.style.display = "none";

// ---------- навигация, баланс ----------
let isAdmin = false;
const $ = id => document.getElementById(id);
function setBal(v) { $("bal").textContent = v.toLocaleString("ru-RU"); window._bal = v; }
function showPage(n) {
  [1,2,3].forEach(i => { $("p"+i).classList.toggle("on", i===n); $("n"+i).classList.toggle("on", i===n); });
  $("balbox").style.display = n===3 ? "none" : "block";
  if (n===3) loadStats();
}
[1,2,3].forEach(i => $("n"+i).onclick = () => showPage(i));
async function post(path, extra) {
  const r = await fetch(path, { method:"POST", headers:{"Content-Type":"application/json"},
                                body: JSON.stringify({ initData: tg.initData, ...extra }) });
  let data = {}; try { data = await r.json(); } catch(e) {}
  return { status:r.status, data };
}

// ---------- игра: Пельмень или Тапок ----------
let side = "pelmen", coinRot = 0, flipping = false;
$("s_pelmen").onclick = () => { side="pelmen"; $("s_pelmen").className="on"; $("s_tapok").className=""; };
$("s_tapok").onclick  = () => { side="tapok";  $("s_tapok").className="on";  $("s_pelmen").className=""; };
document.querySelectorAll(".quick span").forEach(el => el.onclick = () => {
  const q = el.dataset.q, b = window._bal || 0;
  $("bet").value = q==="all" ? b : q==="half" ? Math.floor(b/2) : q;
});
const FUNNY_WIN  = ["Пельмень зашёл идеально! 🥟","Тапок в этот раз на твоей стороне 🩴","Фортуна подмигнула из-под дивана 😎"];
const FUNNY_LOSE = ["Мимо! Бабушка бы не одобрила 👵","Тапок прилетел не туда 🤡","Пельмень сбежал со сковородки 🏃"];
const pick = a => a[Math.floor(Math.random()*a.length)];
$("flip").onclick = async () => {
  if (flipping) return;
  const bet = parseInt($("bet").value, 10);
  if (!bet || bet < 1) { $("coinmsg").textContent = "Введи ставку"; return; }
  if (bet > (window._bal||0)) { $("coinmsg").textContent = "Недостаточно монет 🪙"; return; }
  flipping = true; $("flip").disabled = true; $("coinmsg").textContent = "";
  const { status, data } = await post("/api/coin", { bet, side });
  if (status !== 200) {
    $("coinmsg").textContent = data.error === "no_money" ? "Недостаточно монет 🪙" : "Ошибка, попробуйте позже";
    if (data.balance !== undefined) setBal(data.balance);
    flipping = false; $("flip").disabled = false; return;
  }
  coinRot = Math.ceil(coinRot/360)*360 + 360*5 + (data.result==="tapok" ? 180 : 0);
  $("coin").style.transform = `rotateY(${coinRot}deg)`;
  setTimeout(() => {
    setBal(data.balance);
    $("coinmsg").textContent = data.won ? `+${bet} 🪙 ${pick(FUNNY_WIN)}` : `−${bet} 🪙 ${pick(FUNNY_LOSE)}`;
    tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(data.won ? "success" : "error");
    flipping = false; $("flip").disabled = false;
  }, 2500);
};

// ---------- админка ----------
async function loadStats() {
  const { status, data } = await post("/api/admin/stats");
  if (status !== 200) return;
  $("stats").textContent = `Пользователей: ${data.users} (заблокировали бота: ${data.blocked}) · Монет в обороте: ${data.total.toLocaleString("ru-RU")}`;
  const top = $("top"); top.innerHTML = "";
  data.top.forEach(u => {
    const row = document.createElement("div");
    const l = document.createElement("span"); l.textContent = (u.name || "—") + (u.username ? " @"+u.username : "") + " · " + u.id;
    const r = document.createElement("b"); r.textContent = u.coins.toLocaleString("ru-RU");
    row.append(l, r); top.appendChild(row);
  });
}
$("g_btn").onclick = async () => {
  const target = $("g_target").value.trim(), amount = parseInt($("g_amount").value, 10);
  if (!target || !amount) { $("g_msg").textContent = "Заполни ID/@username и сумму"; return; }
  $("g_btn").disabled = true;
  const { status, data } = await post("/api/admin/give", { target, amount });
  $("g_btn").disabled = false;
  $("g_msg").textContent = status === 200
    ? `✅ ${data.name || data.user_id}: ${data.applied > 0 ? "+" : ""}${data.applied}, баланс ${data.balance}`
    : "❌ " + (data.error || "Ошибка");
  if (status === 200) { $("g_amount").value = ""; loadStats(); }
};
$("b_btn").onclick = () => {
  const text = $("b_text").value.trim();
  if (!text) { $("b_msg").textContent = "Введи текст"; return; }
  const go = async ok => {
    if (!ok) return;
    $("b_btn").disabled = true;
    const { status, data } = await post("/api/admin/broadcast", { text });
    $("b_btn").disabled = false;
    if (status === 200) { $("b_msg").textContent = `📣 Отправка запущена: получателей ${data.recipients}. Итог придёт в чат с ботом.`; $("b_text").value = ""; }
    else $("b_msg").textContent = "❌ " + (data.error || "Ошибка");
  };
  tg.showConfirm ? tg.showConfirm("Отправить это сообщение всем пользователям?", go) : go(confirm("Отправить всем?"));
};

init();
</script>
</body>
</html>
